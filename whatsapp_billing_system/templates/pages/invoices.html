<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Invoices - WhatsApp Billing System</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">WABS</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="customers.html">Customers</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="invoices.html">Invoices</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="send_message.html">Send Message</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <h2>View Invoices</h2>

        <div class="mb-3">
            <label for="customer-select-for-invoices" class="form-label">Select Customer</label>
            <select class="form-select" id="customer-select-for-invoices">
                <!-- Options will be populated by JavaScript -->
                <option selected>Select a customer...</option>
            </select>
        </div>

        <div class="card mt-4">
            <div class="card-header">
                Invoice List
            </div>
            <div class="card-body">
                <table class="table table-striped mt-2">
                    <thead>
                        <tr>
                            <th>Invoice ID</th>
                            <th>Due Date</th>
                            <th>Amount</th>
                            <th>Status</th>
                            <th>Payment Link</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="invoice-list-table-body">
                        <!-- Invoice rows will be inserted here by JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../public/js/main.js" defer></script>
</body>
</html>
