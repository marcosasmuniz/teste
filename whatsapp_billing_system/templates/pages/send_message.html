<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Send Message - WhatsApp Billing System</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">WABS</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="customers.html">Customers</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="invoices.html">Invoices</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="send_message.html">Send Message</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <h2>Send Manual Message</h2>

        <div class="card mt-4">
            <div class="card-header">
                New Message
            </div>
            <div class="card-body">
                <form id="send-manual-message-form">
                    <div class="mb-3">
                        <label for="message-recipient" class="form-label">Recipient WhatsApp Number</label>
                        <input type="text" class="form-control" id="message-recipient" placeholder="e.g., 55119XXXXXXXX" required>
                    </div>
                    <div class="mb-3">
                        <label for="message-body" class="form-label">Message Body</label>
                        <textarea class="form-control" id="message-body" rows="5" required></textarea>
                    </div>
                    <button type="submit" id="send-message-btn" class="btn btn-primary">Send Message</button>
                </form>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../public/js/main.js" defer></script>
</body>
</html>
